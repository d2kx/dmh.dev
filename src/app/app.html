<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="site-wrapper">
  <mat-toolbar role="banner" class="site-header">
    <div class="header-inner">
      <a routerLink="/" class="brand" aria-label="dmh.dev home">
        <span class="sakura-dot" aria-hidden="true"></span>
        <span class="brand-monogram">dmh</span>
        <span class="brand-domain">.dev</span>
      </a>

      <div class="header-actions">
        <nav aria-label="Primary">
          <ul class="nav-list">
            @for (item of navItems(); track item.path) {
              <li>
                <a
                  mat-button
                  [routerLink]="item.path"
                  routerLinkActive="active-nav"
                  [routerLinkActiveOptions]="{ exact: item.exact }"
                  class="nav-link"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </nav>

        <button
          mat-icon-button
          type="button"
          class="theme-toggle"
          (click)="theme.toggleScheme()"
          [attr.aria-label]="'Switch to ' + theme.nextScheme() + ' theme'"
          [attr.title]="'Switch to ' + theme.nextScheme() + ' theme'"
        >
          @if (theme.resolvedScheme() === 'dark') {
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
          } @else {
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </mat-toolbar>

  <main id="main-content" class="site-main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">
        <strong>{{ title() }}</strong> — Dennis Martin Herbers
      </p>

      <nav aria-label="Legal and secondary links">
        <ul class="footer-links">
          <li><a routerLink="/about">About</a></li>
          <li><a routerLink="/impressum">Impressum / Legal Notice</a></li>
          <li><a routerLink="/privacy">Datenschutz / Privacy</a></li>
        </ul>
      </nav>
    </div>
  </footer>
</div>
