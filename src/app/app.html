<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="site-wrapper">
  <header class="site-header">
    <div class="header-inner">
      <a routerLink="/" class="brand" aria-label="dmh.dev home">
        <span class="brand-monogram" aria-hidden="true">dmh</span>
        <span class="brand-domain">.dev</span>
      </a>

      <nav aria-label="Primary">
        <ul class="nav-list">
          @for (item of navItems(); track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                class="nav-link"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>
        <strong>{{ title() }}</strong> — Dennis Martin Herbers
      </p>
      <p class="footer-meta">
        Built with Angular 22 (Hybrid Prerender &amp; SSR) · Hosted on Railway
      </p>
    </div>
  </footer>
</div>
