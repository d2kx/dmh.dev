<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Illuminated Astrolabe / Folio Medallion -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#140d1e" stroke="#f43f85" stroke-width="2.2" />
  <!-- Zodiac / Astrolabe Concentric Rings -->
  <circle cx="32" cy="32" r="22" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.78" stroke-dasharray="3 2.5" />
  <circle cx="32" cy="32" r="16.5" fill="#1e132d" stroke="#f43f85" stroke-width="1.2" stroke-opacity="0.65" />
  <!-- 4 Astrolabe Quadrant Spokes (f68r3) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#f59e0b" stroke-width="1.1" stroke-opacity="0.45" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="#f59e0b" stroke-width="1.1" stroke-opacity="0.45" />
  <!-- Central Botanical / Alkanet & Sakura Rosette -->
  <g transform="translate(32 32)">
    <path d="M 0 -2 C -4 -7.5 -5.8 -13.5 -2.2 -16.2 L 0 -13.5 L 2.2 -16.2 C 5.8 -13.5 4 -7.5 0 -2 Z" fill="#f43f85" />
    <path d="M 0 -2 C -4 -7.5 -5.8 -13.5 -2.2 -16.2 L 0 -13.5 L 2.2 -16.2 C 5.8 -13.5 4 -7.5 0 -2 Z" fill="#fb7185" transform="rotate(72)" />
    <path d="M 0 -2 C -4 -7.5 -5.8 -13.5 -2.2 -16.2 L 0 -13.5 L 2.2 -16.2 C 5.8 -13.5 4 -7.5 0 -2 Z" fill="#f43f85" transform="rotate(144)" />
    <path d="M 0 -2 C -4 -7.5 -5.8 -13.5 -2.2 -16.2 L 0 -13.5 L 2.2 -16.2 C 5.8 -13.5 4 -7.5 0 -2 Z" fill="#fb7185" transform="rotate(216)" />
    <path d="M 0 -2 C -4 -7.5 -5.8 -13.5 -2.2 -16.2 L 0 -13.5 L 2.2 -16.2 C 5.8 -13.5 4 -7.5 0 -2 Z" fill="#f43f85" transform="rotate(288)" />
  </g>
  <!-- Golden Star Accents (Pleiades / Starred Recipes) -->
  <circle cx="32" cy="32" r="3.6" fill="#fde68a" />
  <circle cx="19" cy="19" r="1.6" fill="#fde68a" />
  <circle cx="45" cy="19" r="1.6" fill="#fde68a" />
  <circle cx="19" cy="45" r="1.6" fill="#fde68a" />
  <circle cx="45" cy="45" r="1.6" fill="#fde68a" />
</svg>
