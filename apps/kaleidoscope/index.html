<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0716" />
    <title>Kaleidoscope · Sakura &amp; Fractal Shader | dmh.dev</title>
    <meta
      name="description"
      content="Real-time WebGL kaleidoscope continuously blending psychedelic fractal symmetry, sakura cherry blossoms, lotus mandalas, and crystal color palettes."
    />
    <meta name="author" content="Dennis Martin Herbers" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kaleidoscope.dmh.dev/" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dmh.dev" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Kaleidoscope · Sakura &amp; Fractal Shader | dmh.dev"
    />
    <meta
      property="og:description"
      content="Real-time WebGL kaleidoscope continuously blending psychedelic fractal symmetry, sakura cherry blossoms, lotus mandalas, and crystal color palettes."
    />
    <meta property="og:url" content="https://kaleidoscope.dmh.dev/" />
    <meta property="og:image" content="https://kaleidoscope.dmh.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kaleidoscope by Dennis Martin Herbers: Sakura and Fractal WebGL Shader"
    />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@D2KX_" />
    <meta
      name="twitter:title"
      content="Kaleidoscope · Sakura &amp; Fractal Shader | dmh.dev"
    />
    <meta
      name="twitter:description"
      content="Real-time WebGL kaleidoscope continuously blending psychedelic fractal symmetry, sakura cherry blossoms, lotus mandalas, and crystal color palettes."
    />
    <meta name="twitter:image" content="https://kaleidoscope.dmh.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Kaleidoscope by Dennis Martin Herbers: Sakura and Fractal WebGL Shader"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main>
      <canvas
        id="kaleidoscope-canvas"
        aria-label="Continuously evolving psychedelic sakura kaleidoscope animation"
        role="img"
      ></canvas>

      <!-- Unified Top-Left Glassmorphic HUD Pill (Logo + Links + Optional Stats + Fullscreen) -->
      <header class="hud-container hud-auto-hide" id="hud-bar">
        <div class="unified-pill">
          <div class="brand-cluster">
            <a
              href="https://www.dmh.dev/projects"
              class="brand-logo-link"
              aria-label="Back to dmh.dev Projects"
              title="Back to dmh.dev Projects"
            >
              <svg
                class="brand-icon"
                viewBox="0 0 64 64"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <polygon
                  points="32,3 52.5,11.5 61,32 52.5,52.5 32,61 11.5,52.5 3,32 11.5,11.5"
                  fill="#13091c"
                  stroke="#ff8ab5"
                  stroke-width="2.5"
                />
                <g opacity="0.92">
                  <polygon points="32,32 32,5 50.5,13.5" fill="#f43f85" opacity="0.85" />
                  <polygon points="32,32 50.5,13.5 59,32" fill="#8b5cf6" opacity="0.85" />
                  <polygon points="32,32 59,32 50.5,50.5" fill="#22d3ee" opacity="0.75" />
                  <polygon points="32,32 50.5,50.5 32,59" fill="#f43f85" opacity="0.85" />
                  <polygon points="32,32 32,59 13.5,50.5" fill="#8b5cf6" opacity="0.85" />
                  <polygon points="32,32 13.5,50.5 5,32" fill="#22d3ee" opacity="0.75" />
                  <polygon points="32,32 5,32 13.5,13.5" fill="#f43f85" opacity="0.85" />
                  <polygon points="32,32 13.5,13.5 32,5" fill="#8b5cf6" opacity="0.85" />
                </g>
                <polygon
                  points="32,11 46.8,17.2 53,32 46.8,46.8 32,53 17.2,46.8 11,32 17.2,17.2"
                  fill="#190b28"
                  fill-opacity="0.6"
                  stroke="#ffffff"
                  stroke-opacity="0.4"
                  stroke-width="1.2"
                />
                <g transform="translate(32 32)">
                  <path
                    d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                    fill="#ffd6e7"
                  />
                  <path
                    d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                    fill="#ffb3d1"
                    transform="rotate(72)"
                  />
                  <path
                    d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                    fill="#ffd6e7"
                    transform="rotate(144)"
                  />
                  <path
                    d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                    fill="#ffb3d1"
                    transform="rotate(216)"
                  />
                  <path
                    d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                    fill="#ffd6e7"
                    transform="rotate(288)"
                  />
                </g>
                <circle cx="32" cy="32" r="3.2" fill="#fffbeb" />
              </svg>
            </a>
            <div class="brand-text">
              <h1 class="brand-title">Kaleidoscope</h1>
              <nav class="brand-links" aria-label="Site and legal links">
                <a href="https://www.dmh.dev">dmh.dev</a>
                <span aria-hidden="true">·</span>
                <a href="https://www.dmh.dev/impressum">Legal Notice</a>
                <span aria-hidden="true">·</span>
                <a href="https://www.dmh.dev/privacy">Privacy</a>
              </nav>
            </div>
          </div>

          <div class="pill-divider" aria-hidden="true"></div>

          <!-- Optional inline performance segment (hidden by default) -->
          <div
            id="perf-segment"
            class="perf-segment"
            aria-label="Live shader performance metrics"
            hidden
          >
            <div class="perf-metrics">
              <span class="perf-dot" aria-hidden="true"></span>
              <span id="perf-fps" class="perf-fps">60 FPS</span>
              <span class="perf-sep" aria-hidden="true">·</span>
              <span id="perf-ms" class="perf-ms">16.7 ms</span>
            </div>
            <svg
              class="perf-sparkline"
              viewBox="0 0 64 20"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <polyline
                id="perf-sparkline-fill"
                fill="rgba(255, 138, 181, 0.16)"
                stroke="none"
                points="0,20 0,5 64,5 64,20"
              />
              <polyline
                id="perf-sparkline-line"
                fill="none"
                stroke="#ff8ab5"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
                points="0,5 64,5"
              />
            </svg>
            <div class="pill-divider" aria-hidden="true"></div>
          </div>

          <!-- Compact Actions (Stats toggle + Fullscreen) -->
          <div class="pill-actions">
            <button
              type="button"
              id="stats-btn"
              class="pill-btn"
              aria-pressed="false"
              title="Toggle performance stats (S)"
            >
              Stats
            </button>
            <button
              type="button"
              id="fullscreen-btn"
              class="pill-btn"
              title="Toggle fullscreen (F)"
            >
              Fullscreen
            </button>
          </div>
        </div>
      </header>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
