<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0716" />
    <title>Kaleidoscope · Interactive Sakura &amp; Fractal Shader | dmh.dev</title>
    <meta
      name="description"
      content="Interactive WebGL kaleidoscope blending psychedelic fractal symmetry with sakura cherry blossom geometry and harmonic color palettes."
    />
    <meta name="author" content="Dennis Martin Herbers" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kaleidoscope.dmh.dev/" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dmh.dev" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Kaleidoscope · Interactive Sakura &amp; Fractal Shader | dmh.dev"
    />
    <meta
      property="og:description"
      content="Interactive WebGL kaleidoscope blending psychedelic fractal symmetry with sakura cherry blossom geometry and harmonic color palettes."
    />
    <meta property="og:url" content="https://kaleidoscope.dmh.dev/" />
    <meta property="og:image" content="https://kaleidoscope.dmh.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kaleidoscope by Dennis Martin Herbers: Interactive Sakura and Fractal WebGL Shader"
    />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@D2KX_" />
    <meta
      name="twitter:title"
      content="Kaleidoscope · Interactive Sakura &amp; Fractal Shader | dmh.dev"
    />
    <meta
      name="twitter:description"
      content="Interactive WebGL kaleidoscope blending psychedelic fractal symmetry with sakura cherry blossom geometry and harmonic color palettes."
    />
    <meta name="twitter:image" content="https://kaleidoscope.dmh.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Kaleidoscope by Dennis Martin Herbers: Interactive Sakura and Fractal WebGL Shader"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <canvas
      id="kaleidoscope-canvas"
      aria-label="Interactive psychedelic sakura kaleidoscope canvas"
      role="img"
    ></canvas>

    <!-- Top bar: Brand header + optional sleek performance pill -->
    <header class="hud-top hud-auto-hide" id="hud-top">
      <div class="brand-pill">
        <a
          href="https://www.dmh.dev/projects"
          class="brand-logo-link"
          aria-label="Back to dmh.dev Projects"
          title="Back to dmh.dev Projects"
        >
          <svg
            class="brand-icon"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <polygon
              points="32,3 52.5,11.5 61,32 52.5,52.5 32,61 11.5,52.5 3,32 11.5,11.5"
              fill="#13091c"
              stroke="#ff8ab5"
              stroke-width="2.5"
            />
            <g opacity="0.92">
              <polygon points="32,32 32,5 50.5,13.5" fill="#f43f85" opacity="0.85" />
              <polygon points="32,32 50.5,13.5 59,32" fill="#8b5cf6" opacity="0.85" />
              <polygon points="32,32 59,32 50.5,50.5" fill="#22d3ee" opacity="0.75" />
              <polygon points="32,32 50.5,50.5 32,59" fill="#f43f85" opacity="0.85" />
              <polygon points="32,32 32,59 13.5,50.5" fill="#8b5cf6" opacity="0.85" />
              <polygon points="32,32 13.5,50.5 5,32" fill="#22d3ee" opacity="0.75" />
              <polygon points="32,32 5,32 13.5,13.5" fill="#f43f85" opacity="0.85" />
              <polygon points="32,32 13.5,13.5 32,5" fill="#8b5cf6" opacity="0.85" />
            </g>
            <polygon
              points="32,11 46.8,17.2 53,32 46.8,46.8 32,53 17.2,46.8 11,32 17.2,17.2"
              fill="#190b28"
              fill-opacity="0.6"
              stroke="#ffffff"
              stroke-opacity="0.4"
              stroke-width="1.2"
            />
            <g transform="translate(32 32)">
              <path
                d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                fill="#ffd6e7"
              />
              <path
                d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                fill="#ffb3d1"
                transform="rotate(72)"
              />
              <path
                d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                fill="#ffd6e7"
                transform="rotate(144)"
              />
              <path
                d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                fill="#ffb3d1"
                transform="rotate(216)"
              />
              <path
                d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
                fill="#ffd6e7"
                transform="rotate(288)"
              />
            </g>
            <circle cx="32" cy="32" r="3.2" fill="#fffbeb" />
          </svg>
        </a>
        <div class="brand-text">
          <h1 class="brand-title">Kaleidoscope</h1>
          <nav class="brand-links" aria-label="Site and legal links">
            <a href="https://www.dmh.dev">dmh.dev</a>
            <span aria-hidden="true">·</span>
            <a href="https://www.dmh.dev/impressum">Legal Notice</a>
            <span aria-hidden="true">·</span>
            <a href="https://www.dmh.dev/privacy">Privacy</a>
          </nav>
        </div>
      </div>

      <!-- Optional sleek performance pill (hidden by default) -->
      <aside
        id="perf-pill"
        class="perf-pill"
        aria-label="Live shader performance metrics"
        hidden
      >
        <div class="perf-metrics">
          <span class="perf-dot" aria-hidden="true"></span>
          <span id="perf-fps" class="perf-fps">60 FPS</span>
          <span class="perf-sep" aria-hidden="true">·</span>
          <span id="perf-ms" class="perf-ms">16.7 ms</span>
        </div>
        <svg
          class="perf-sparkline"
          viewBox="0 0 72 22"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <polyline
            id="perf-sparkline-fill"
            fill="rgba(255, 138, 181, 0.16)"
            stroke="none"
            points="0,22 0,6 72,6 72,22"
          />
          <polyline
            id="perf-sparkline-line"
            fill="none"
            stroke="#ff8ab5"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            points="0,6 72,6"
          />
        </svg>
      </aside>
    </header>

    <!-- Bottom interactive control dock -->
    <main class="hud-bottom hud-auto-hide" id="hud-bottom" aria-label="Kaleidoscope controls">
      <div class="control-dock">
        <!-- Preset Mode Selector -->
        <div class="mode-group" role="group" aria-label="Visual preset mode">
          <button
            type="button"
            class="mode-btn"
            data-mode="sakura"
            aria-pressed="true"
          >
            Sakura
          </button>
          <button
            type="button"
            class="mode-btn"
            data-mode="prism"
            aria-pressed="false"
          >
            Prism
          </button>
          <button
            type="button"
            class="mode-btn"
            data-mode="lotus"
            aria-pressed="false"
          >
            Lotus
          </button>
          <button
            type="button"
            class="mode-btn"
            data-mode="cyber"
            aria-pressed="false"
          >
            Cyber
          </button>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Sliders -->
        <div class="sliders-group">
          <div class="control-item">
            <div class="control-label-row">
              <label for="segments-slider">Symmetry</label>
              <span id="segments-value" class="control-value">8</span>
            </div>
            <input
              type="range"
              id="segments-slider"
              min="4"
              max="16"
              step="1"
              value="8"
            />
          </div>

          <div class="control-item">
            <div class="control-label-row">
              <label for="speed-slider">Speed</label>
              <span id="speed-value" class="control-value">1.0x</span>
            </div>
            <input
              type="range"
              id="speed-slider"
              min="0.1"
              max="3.0"
              step="0.1"
              value="1.0"
            />
          </div>

          <div class="control-item">
            <div class="control-label-row">
              <label for="bloom-slider">Bloom</label>
              <span id="bloom-value" class="control-value">1.0</span>
            </div>
            <input
              type="range"
              id="bloom-slider"
              min="0.4"
              max="1.8"
              step="0.1"
              value="1.0"
            />
          </div>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Utility Actions -->
        <div class="actions-group">
          <button
            type="button"
            id="pause-btn"
            class="action-btn"
            aria-pressed="false"
            title="Pause or resume animation (Space)"
          >
            Pause
          </button>
          <button
            type="button"
            id="stats-btn"
            class="action-btn"
            aria-pressed="false"
            title="Toggle optional performance overlay (P)"
          >
            Stats
          </button>
          <button
            type="button"
            id="fullscreen-btn"
            class="action-btn"
            title="Toggle fullscreen (F)"
          >
            Fullscreen
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
