<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="k-sakura" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8ab5" />
      <stop offset="50%" stop-color="#f43f85" />
      <stop offset="100%" stop-color="#b81d5c" />
    </linearGradient>
    <linearGradient id="k-violet" x1="56" y1="8" x2="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="k-cyan" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="k-core" cx="32" cy="32" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="55%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f43f85" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer octagonal kaleidoscope frame -->
  <polygon
    points="32,3 52.5,11.5 61,32 52.5,52.5 32,61 11.5,52.5 3,32 11.5,11.5"
    fill="#13091c"
    stroke="url(#k-sakura)"
    stroke-width="2"
  />

  <!-- Alternating prism facets (8-fold kaleidoscope symmetry) -->
  <g opacity="0.92">
    <polygon points="32,32 32,5 50.5,13.5" fill="url(#k-sakura)" opacity="0.85" />
    <polygon points="32,32 50.5,13.5 59,32" fill="url(#k-violet)" opacity="0.85" />
    <polygon points="32,32 59,32 50.5,50.5" fill="url(#k-cyan)" opacity="0.75" />
    <polygon points="32,32 50.5,50.5 32,59" fill="url(#k-sakura)" opacity="0.85" />
    <polygon points="32,32 32,59 13.5,50.5" fill="url(#k-violet)" opacity="0.85" />
    <polygon points="32,32 13.5,50.5 5,32" fill="url(#k-cyan)" opacity="0.75" />
    <polygon points="32,32 5,32 13.5,13.5" fill="url(#k-sakura)" opacity="0.85" />
    <polygon points="32,32 13.5,13.5 32,5" fill="url(#k-violet)" opacity="0.85" />
  </g>

  <!-- Inner geometric diamond mirror lines -->
  <polygon
    points="32,10 47.5,16.5 54,32 47.5,47.5 32,54 16.5,47.5 10,32 16.5,16.5"
    fill="#190b28"
    fill-opacity="0.58"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="1.2"
  />

  <!-- Central 5-petal notched Sakura blossom inside the kaleidoscope -->
  <g transform="translate(32 32)">
    <path
      d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
      fill="#ffd6e7"
    />
    <path
      d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
      fill="#ffb3d1"
      transform="rotate(72)"
    />
    <path
      d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
      fill="#ffd6e7"
      transform="rotate(144)"
    />
    <path
      d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
      fill="#ffb3d1"
      transform="rotate(216)"
    />
    <path
      d="M 0 -2 C -4.5 -8 -6.5 -15 -2.6 -18.5 L 0 -15.2 L 2.6 -18.5 C 6.5 -15 4.5 -8 0 -2 Z"
      fill="#ffd6e7"
      transform="rotate(288)"
    />
  </g>

  <!-- Radial prism glow & center jewel -->
  <circle cx="32" cy="32" r="11" fill="url(#k-core)" />
  <circle cx="32" cy="32" r="3.2" fill="#fffbeb" />
</svg>
